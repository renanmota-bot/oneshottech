<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Shot Tech — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/80 border border-slate-800 backdrop-blur-xl p-8 rounded-3xl shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-black tracking-tight text-white">ONE SHOT <span class="text-sky-400">TECH</span></h1>
            <p class="text-xs text-slate-400">Plataforma de Casting e Gestão de Eventos</p>
        </div>

        {% if messages %}
            <div class="space-y-2">
                {% for message in messages %}
                    <div class="p-3 rounded-xl text-xs font-semibold bg-rose-500/10 border border-rose-500/30 text-rose-400 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">E-mail / Usuário</label>
                <input type="text" name="username" placeholder="seu@email.com" required class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white outline-none focus:border-sky-500 transition-all">
            </div>

            <div>
                <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">Senha</label>
                <input type="password" name="password" placeholder="••••••••" required class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white outline-none focus:border-sky-500 transition-all">
            </div>

            <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-xs py-3.5 rounded-2xl transition-all shadow-lg shadow-sky-500/20 cursor-pointer">
                Acessar Plataforma
            </button>
        </form>

        <div class="pt-4 border-t border-slate-800/80 space-y-3">
            <p class="text-[10px] font-extrabold uppercase tracking-widest text-slate-500 text-center">⚡ ACESSO RÁPIDO DE DEMONSTRAÇÃO</p>
            
            <div class="grid grid-cols-2 gap-2">
                <a href="{% url 'login_demo_direto' 'admin' %}" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs py-2.5 rounded-xl text-center transition-all flex items-center justify-center gap-1.5">
                    🏢 Produtora
                </a>
                <a href="{% url 'login_demo_direto' 'staff' %}" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs py-2.5 rounded-xl text-center transition-all flex items-center justify-center gap-1.5">
                    🎥 Staff
                </a>
            </div>

            <a href="{% url 'login_demo_direto' 'dev' %}" class="w-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 font-extrabold text-xs py-2.5 rounded-xl text-center transition-all block cursor-pointer">
                🛠️ Acesso Desenvolvedor (Super Admin)
            </a>
        </div>

    </div>

</body>
</html>
