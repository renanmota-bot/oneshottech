<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Shot Tech — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl">
        
        <!-- LOGO -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-black text-sky-400 tracking-wider">ONE SHOT TECH</h1>
            <p class="text-xs text-slate-400">Plataforma de Casting e Gestão de Eventos</p>
        </div>

        <!-- MENSAGENS -->
        {% if messages %}
            <div class="space-y-2">
                {% for message in messages %}
                    <div class="p-3.5 rounded-xl text-xs font-semibold border {% if message.tags == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-400{% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-400{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="loginForm" method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">E-mail / Usuário</label>
                <input type="text" id="userInput" name="username" required placeholder="seu@email.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-sky-500 transition-all">
            </div>

            <div>
                <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Senha</label>
                <input type="password" id="passInput" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-sky-500 transition-all">
            </div>

            <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs py-3.5 rounded-xl transition-all shadow-lg shadow-sky-500/20 cursor-pointer">
                Acessar Plataforma
            </button>
        </form>

        <!-- ATALHOS RÁPIDOS (AMBIENTE LOCAL / TESTE) -->
        <div class="border-t border-slate-800/80 pt-4 space-y-2">
            <p class="text-[10px] uppercase font-bold text-slate-500 text-center tracking-wider">⚡ Atalhos Rápidos (Ambiente de Teste)</p>
            
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="preencherLogin('admin', 'Motinha@09@')" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 text-[11px] font-bold py-2 rounded-xl transition-all cursor-pointer">
                    👑 Super
                </button>
                <button type="button" onclick="preencherLogin('teste@teste.com.br', '123456')" class="bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/20 text-[11px] font-bold py-2 rounded-xl transition-all cursor-pointer">
                    🏢 Admin
                </button>
                <button type="button" onclick="preencherLogin('staff@staff.com', '123456')" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 text-[11px] font-bold py-2 rounded-xl transition-all cursor-pointer">
                    👤 Staff
                </button>
            </div>
        </div>

    </div>

    <script>
        function preencherLogin(user, pass) {
            document.getElementById('userInput').value = user;
            document.getElementById('passInput').value = pass;
            document.getElementById('loginForm').submit();
        }
    </script>
</body>
</html>
