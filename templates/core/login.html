<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Shot Tech — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl space-y-6 shadow-2xl">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-black text-sky-400 tracking-wider">ONE SHOT TECH</h1>
            <p class="text-xs text-slate-400">Plataforma de Casting e Gestão de Eventos</p>
        </div>

        {% if messages %}
            <div class="space-y-2">
                {% for message in messages %}
                    <div class="p-3.5 rounded-xl text-xs font-semibold border {% if message.tags == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-400{% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-400{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- FORMULÁRIO TRADICIONAL -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1.5 ml-1">E-mail / Usuário</label>
                <input type="text" name="username" required placeholder="seu@email.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-sky-500 transition-all">
            </div>

            <div>
                <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1.5 ml-1">Senha</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-sky-500 transition-all">
            </div>

            <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-xs py-3.5 rounded-xl transition-all shadow-lg shadow-sky-500/20 cursor-pointer">
                Acessar Plataforma
            </button>
        </form>

        <!-- BOTÕES DE ACESSO DIRETO (DEMO) -->
        <div class="border-t border-slate-800 pt-5 space-y-3">
            <p class="text-[10px] text-center text-slate-500 font-bold uppercase tracking-wider">⚡ Acesso Rápido de Demonstração</p>
            
            <div class="grid grid-cols-2 gap-2">
                <a href="{% url 'login_demo_direto' 'admin' %}" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold py-3 px-2 rounded-xl text-center transition-all flex items-center justify-center gap-1.5">
                    <span>🏢 Produtora</span>
                </a>

                <a href="{% url 'login_demo_direto' 'staff' %}" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold py-3 px-2 rounded-xl text-center transition-all flex items-center justify-center gap-1.5">
                    <span>👥 Staff</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
